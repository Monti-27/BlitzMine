services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blitzmine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blitzmine_password}
      POSTGRES_DB: ${POSTGRES_DB:-blitzmine_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blitzmine']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-blitzmine}:${POSTGRES_PASSWORD:-blitzmine_password}@postgres:5432/${POSTGRES_DB:-blitzmine_db}
      REDIS_URL: redis://redis:6379
      SOLANA_CLUSTER: ${SOLANA_CLUSTER:-devnet}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      SOLANA_WS_URL: ${SOLANA_WS_URL:-wss://api.devnet.solana.com}
      PROGRAM_ID: ${PROGRAM_ID:-CVud2PiM4hYk2YkDa2DZ2dnJwd9gVCXZFJP18DzE1r4F}
      MAGIC_ROUTER_URL: ${MAGIC_ROUTER_URL:-https://devnet-router.magicblock.app}
      EPHEMERAL_RPC_URL: ${EPHEMERAL_RPC_URL:-https://devnet-as.magicblock.app}
      EPHEMERAL_WS_URL: ${EPHEMERAL_WS_URL:-wss://devnet-as.magicblock.app}
      EPHEMERAL_VALIDATOR: ${EPHEMERAL_VALIDATOR:-MAS1Dt9qreoRMQ14YQuhg8UTZMMzDdKhmkZMECCzk57}
      ADMIN_KEYPAIR: ${ADMIN_KEYPAIR:-}
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      PRIVY_APP_SECRET: ${PRIVY_APP_SECRET:-}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-change-this-in-production}
      NODE_ENV: production
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
